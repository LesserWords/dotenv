# alacritty.toml (Template)
# Cross-platform, GPU-accelerated terminal.

[env]
TERM = "xterm-256color"

[window]
padding = { x = 8, y = 8 }
dynamic_padding = true
opacity = 0.95

[font]
normal = { family = "Cascadia Code PL", style = "Regular" }
bold = { family = "Cascadia Code PL", style = "Bold" }
italic = { family = "Cascadia Code PL", style = "Italic" }
size = 11.0

[colors.primary]
background = "#1e1e1e"
foreground = "#d4d4d4"

# Set up the shell (example for Windows)
# [terminal.shell]
# program = "powershell"
# args = ["-nologo"]
